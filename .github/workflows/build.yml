name: Build GNOME Extension & Ubuntu/Debian Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ "published", "created" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gettext zip dpkg python3

      - name: Compile Schemas and Translations
        run: |
          make build

      - name: Pack GNOME Shell Extension (.zip for EGO)
        run: |
          make pack

      - name: Build Ubuntu / Debian / Xubuntu Package (.deb)
        run: |
          make deb

      - name: Upload GNOME Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Novus_Tools@sgc-novus.fun.zip
          path: Novus_Tools@sgc-novus.fun.zip

      - name: Upload Debian/Ubuntu/Xubuntu .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novus-daynight-deb
          path: dist/*.deb

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Novus_Tools@sgc-novus.fun.zip
            dist/*.deb
